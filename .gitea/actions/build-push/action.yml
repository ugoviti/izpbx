name: izpbx build & push
description: Build izpbx-asterisk and push it to the private registry (Docker Hub is reached only through the promote workflow)

inputs:
  version:
    description: Version, used as APP_VER and for the image tags (see .gitea/actions/image-tags)
    required: true
  latest:
    description: "'true' to also tag latest (stable X.Y.Z only)"
    default: 'false'
  build-number:
    description: Optional build number tag suffix
    default: ''
  build-args:
    description: Extra newline separated build args (KEY=value)
    default: ''
  cache-tag:
    description: Registry tag used for the buildx cache
    default: buildcache
  platforms:
    default: linux/amd64
  registry-host:
    description: Private registry host (secrets.REGISTRY_HOST)
    required: true
  registry-username:
    required: true
  registry-token:
    required: true

runs:
  using: composite
  steps:
    - name: registry login
      id: login
      uses: ./.gitea/actions/registry-login
      with:
        registry-host: ${{ inputs.registry-host }}
        registry-username: ${{ inputs.registry-username }}
        registry-token: ${{ inputs.registry-token }}

    - name: image tags
      id: tags
      uses: ./.gitea/actions/image-tags
      with:
        images: ${{ steps.login.outputs.image }}
        version: ${{ inputs.version }}
        latest: ${{ inputs.latest }}
        build-number: ${{ inputs.build-number }}

    - name: build metadata
      id: meta
      shell: bash
      run: |
        echo "app_build_commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "app_build_date=$(date +%s)" >> "$GITHUB_OUTPUT"
        env | sort

    - name: build and push
      uses: docker/build-push-action@v6
      with:
        context: izpbx-asterisk
        file: izpbx-asterisk/Dockerfile
        platforms: ${{ inputs.platforms }}
        push: true
        # no provenance attestation and no metadata-action labels:
        # they would embed the private build source URL in the image
        provenance: false
        tags: ${{ steps.tags.outputs.tags }}
        build-args: |
          APP_VER=${{ inputs.version }}
          APP_VER_BUILD=${{ github.run_number }}
          APP_BUILD_COMMIT=${{ steps.meta.outputs.app_build_commit }}
          APP_BUILD_DATE=${{ steps.meta.outputs.app_build_date }}
          ${{ inputs.build-args }}
        # build cache stored in the Gitea registry (replaces the Drone volume cache)
        cache-from: type=registry,ref=${{ steps.login.outputs.image }}:${{ inputs.cache-tag }}
        cache-to: type=registry,ref=${{ steps.login.outputs.image }}:${{ inputs.cache-tag }},mode=max,image-manifest=true,oci-mediatypes=true

    # post-build security checks on the image just pushed (build-push-action with push:true
    # doesn't load it in the local docker daemon, so pull it back: the registry login above is reused)
    - name: verify image
      shell: bash
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
        BUILD_ARGS: ${{ inputs.build-args }}
        # minimum php-common VERSION-RELEASE: fixes CVE-2026-109618 / CVE-2026-109619 (RHSA-2026:87080)
        PHP_MIN: 7.4.33-8
      run: |
        set -euo pipefail
        IMAGE=$(printf '%s\n' "$TAGS" | sed '/^$/d' | head -1)
        # expected Asterisk version: build-arg override (eg. dev workflow) or the Dockerfile ARG default
        ASTERISK_VER=$(printf '%s\n' "$BUILD_ARGS" | sed -n 's/^ *ASTERISK_VER=//p' | tail -1 | tr -d ' ')
        [ -n "$ASTERISK_VER" ] || ASTERISK_VER=$(sed -n 's/^ARG ASTERISK_VER=//p' izpbx-asterisk/Dockerfile | head -1)
        [ -n "$ASTERISK_VER" ] || { echo "::error::cannot determine the expected ASTERISK_VER"; exit 1; }
        docker pull -q "$IMAGE"
        docker run --rm --entrypoint "" -e PHP_MIN="$PHP_MIN" -e ASTERISK_VER="$ASTERISK_VER" "$IMAGE" bash -c '
          set -u
          FAIL=0
          PHP_REL=$(rpm -q --qf "%{VERSION}-%{RELEASE}" php-common) || PHP_REL=missing
          if [ "$(printf "%s\n" "$PHP_MIN" "$PHP_REL" | sort -V | head -1)" = "$PHP_MIN" ] && [ "$PHP_REL" != missing ]; then
            echo "OK   php-common $PHP_REL >= $PHP_MIN"
          else
            echo "FAIL php-common $PHP_REL < $PHP_MIN (CVE-2026-109618/109619)"; FAIL=1
          fi
          AST=$(asterisk -V 2>&1 || true)
          if printf "%s" "$AST" | grep -qF "Asterisk ${ASTERISK_VER}"; then
            echo "OK   $AST"
          else
            echo "FAIL asterisk -V: \"$AST\", expected ${ASTERISK_VER}"; FAIL=1
          fi
          URL_INCLUDE=$(php -r "echo ini_get(\"allow_url_include\");" 2>/dev/null) || URL_INCLUDE=error
          case "$(printf "%s" "$URL_INCLUDE" | tr "[:upper:]" "[:lower:]")" in
            ""|0|off|false|no) echo "OK   allow_url_include=\"$URL_INCLUDE\"" ;;
            *) echo "FAIL allow_url_include=\"$URL_INCLUDE\" (must be Off)"; FAIL=1 ;;
          esac
          exit $FAIL
        '
