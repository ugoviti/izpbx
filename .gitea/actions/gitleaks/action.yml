name: izpbx gitleaks
description: Install the pinned gitleaks release and scan the full git history (requires checkout with fetch-depth 0)

# GITLEAKS_VERSION / GITLEAKS_SHA256 below are the single source of truth,
# also read by the local hook .githooks/pre-commit and by
# izpbx-asterisk/tools/gitleaks-mirror.sh.
# The release tarball is taken from the Gitea copy (generic package "gitleaks" of
# the owner of the repository, uploaded by gitleaks-mirror.sh at every version
# change), GitHub only when that copy is missing or cannot be read: an outage of
# the GitHub release downloads (HTTP 504) failed izpbx-promote. Same sha256 check
# for both.

inputs:
  config:
    description: Private extra rules (TOML content, from secrets.GITLEAKS_CONFIG). Empty = default rules only
    default: ''
  registry-username:
    description: User of the Gitea package registry (secrets.REGISTRY_USERNAME). Empty = download from GitHub only
    default: ''
  registry-token:
    description: Token of the Gitea package registry (secrets.REGISTRY_TOKEN)
    default: ''

runs:
  using: composite
  steps:
    - name: gitleaks scan
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        PRIVATE_CONFIG: ${{ inputs.config }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -euo pipefail
        TGZ="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        mkdir -p "$RUNNER_TEMP/gitleaks"
        MIRROR="${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY%%/*}/generic/gitleaks/${GITLEAKS_VERSION}/${TGZ}"
        if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_TOKEN" ] &&
           curl -fsSL --max-time 120 -u "${REGISTRY_USERNAME}:${REGISTRY_TOKEN}" -o "$RUNNER_TEMP/$TGZ" "$MIRROR"; then
          echo "gitleaks ${GITLEAKS_VERSION}: Gitea copy"
        else
          [ -z "$REGISTRY_USERNAME" ] || echo "::warning::gitleaks ${GITLEAKS_VERSION}: no Gitea copy (run izpbx-asterisk/tools/gitleaks-mirror.sh), downloading from GitHub"
          # the release download URL, else the same asset through the API (the download
          # URL answered 504 for hours while the API served the asset)
          if ! curl -fsSL --retry 2 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/$TGZ" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TGZ}"; then
            ID=$(curl -fsSL --retry 2 "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" |
              jq -r --arg n "$TGZ" '.assets[] | select(.name == $n) | .id')
            curl -fsSL --retry 2 --retry-all-errors --retry-delay 10 -H 'Accept: application/octet-stream' \
              -o "$RUNNER_TEMP/$TGZ" "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${ID}"
          fi
        fi
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$TGZ" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/$TGZ" -C "$RUNNER_TEMP/gitleaks" gitleaks

        ARGS=(git --redact --verbose --no-banner)
        if [ -n "$PRIVATE_CONFIG" ]; then
          printf '%s\n' "$PRIVATE_CONFIG" > "$RUNNER_TEMP/gitleaks.toml"
          ARGS+=(--config "$RUNNER_TEMP/gitleaks.toml")
        else
          echo "::warning::GITLEAKS_CONFIG secret not set, scanning with default rules only"
        fi
        "$RUNNER_TEMP/gitleaks/gitleaks" "${ARGS[@]}" .
