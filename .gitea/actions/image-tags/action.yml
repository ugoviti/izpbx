name: izpbx image tags
description: Single source of truth for the image tag scheme (tags.sh), shared by build and promote

# 20.16.22      -> 20.16.22, 20.16, 20 [, 20.16.22-<build-number>] [, latest]
# 20.16.22-rc1  -> 20.16.22-rc1 [, 20.16.22-rc1-<build-number>]  (prerelease: never X.Y, X, latest)
# dev-22.17     -> dev-22.17                                       (not semver: as-is, never latest)
# latest: 'true', 'false', or 'branch' (only when branch is latest-branch: V2/V3,
# latest stays on release/20.16 until the decision Q1)

inputs:
  images:
    description: Image name(s), newline separated
    required: true
  version:
    description: Version to tag (eg. 22.17.0)
    required: true
  latest:
    description: "'true', 'false' or 'branch' (only applied to stable X.Y.Z versions)"
    default: 'false'
  branch:
    description: Branch of the version, for latest 'branch'
    default: ''
  latest-branch:
    description: The branch whose stable versions get latest (Q1)
    default: release/20.16
  build-number:
    description: Optional build number, adds the <version>-<build-number> tag
    default: ''

outputs:
  tags:
    description: Full image references, newline separated
    value: ${{ steps.tags.outputs.tags }}

runs:
  using: composite
  steps:
    - name: compute tags
      id: tags
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        VERSION: ${{ inputs.version }}
        LATEST: ${{ inputs.latest }}
        BRANCH: ${{ inputs.branch }}
        LATEST_BRANCH: ${{ inputs.latest-branch }}
        BUILD_NUMBER: ${{ inputs.build-number }}
      run: |
        set -euo pipefail
        tags=$("$GITHUB_ACTION_PATH/tags.sh")
        printf '%s\n' "$tags"
        { echo "tags<<IZPBX_TAGS"; printf '%s\n' "$tags"; echo "IZPBX_TAGS"; } >> "$GITHUB_OUTPUT"
