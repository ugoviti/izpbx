name: izpbx registry login
description: Setup buildx and log in to the private registry and, optionally, Docker Hub. Single place where the private image path is built.

inputs:
  registry-host:
    description: Private registry host, from secrets.REGISTRY_HOST (a secret so it is masked in job logs)
    required: true
  registry-repository:
    description: Image path inside the private registry
    default: izpbx/izpbx-asterisk
  registry-username:
    required: true
  registry-token:
    required: true
  dockerhub-username:
    description: Leave empty to skip the Docker Hub login
    default: ''
  dockerhub-password:
    default: ''

outputs:
  image:
    description: Full private image path (host/repository)
    value: ${{ steps.reg.outputs.image }}

runs:
  using: composite
  steps:
    - name: resolve image
      id: reg
      shell: bash
      env:
        REGISTRY_HOST: ${{ inputs.registry-host }}
        REGISTRY_REPOSITORY: ${{ inputs.registry-repository }}
      run: |
        set -eu
        echo "::add-mask::${REGISTRY_HOST}"
        echo "image=${REGISTRY_HOST}/${REGISTRY_REPOSITORY}" >> "$GITHUB_OUTPUT"

    - name: setup buildx
      uses: docker/setup-buildx-action@v3

    - name: login private registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry-host }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    - name: login docker hub
      if: inputs.dockerhub-username != ''
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
