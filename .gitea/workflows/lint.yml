# izPBX lint (Gitea Actions): shellcheck and hadolint, the pinned versions of izpbx-asterisk/tests/lint.sh.
# On every push and pull request: a finding fails the job, so a PR with a shellcheck error
# is blocked when "lint" is a required status check of the protected branch (main, release/*).
# The runner runs the job in a container: lint runs in Docker-in-Docker (izpbx-asterisk/tests/ci/dind-run.sh),
# where the bind mounts of its tool containers make sense.
#
# Failure notify: MATRIX_TOKEN (secret), MATRIX_HOMESERVER, MATRIX_ROOM_ID (variables)

name: lint

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: shellcheck and hadolint
        shell: bash
        run: izpbx-asterisk/tests/ci/dind-run.sh --lint

      - name: matrix notify
        if: failure()
        uses: ./.gitea/actions/matrix-notify
        with:
          status: ${{ job.status }}
          label: lint ref:${{ gitea.ref_name }}
          token: ${{ secrets.MATRIX_TOKEN }}
          homeserver: ${{ vars.MATRIX_HOMESERVER }}
          room-id: ${{ vars.MATRIX_ROOM_ID }}
