# izPBX publish (Gitea Actions)
# Manual only: Repository > Actions > izpbx-promote > Run workflow.
# The ONLY way code and images leave the private infrastructure:
#   1. gitleaks scan of the full history with the private rules (blocks everything on findings)
#   2. pushes the git tag, and the branch up to that tag, to GitHub (fast-forward only)
#   3. copies the image already built in the Gitea registry to Docker Hub, without rebuilding
#      (same digest you tested). Tag scheme: .gitea/actions/image-tags
#        20.16.22    -> 20.16.22, 20.16, 20 [, latest]
#        dev-22.17   -> dev-22.17 (not a git tag: GitHub push is skipped, never latest)
#
# Required secrets:   REGISTRY_HOST, REGISTRY_USERNAME, REGISTRY_TOKEN, DOCKER_USERNAME,
#                     DOCKER_PASSWORD, GH_PUSH_TOKEN, GITLEAKS_CONFIG, MATRIX_PASSWORD
# Required variables: MATRIX_HOMESERVER, MATRIX_ROOM_ID, MATRIX_USER

name: izpbx-promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must exist in the Gitea registry, eg. 20.16.22)
        required: true
      latest:
        description: Also move the "latest" Docker tag (only 20.16.x until the decision Q1, refused otherwise)
        type: boolean
        default: true
      github:
        description: Also push the git tag and branch to GitHub
        type: boolean
        default: true
      branch:
        description: GitHub branch to fast-forward to the tagged commit
        default: main
      dockerhub:
        description: Also publish the image on Docker Hub
        type: boolean
        default: true

concurrency:
  group: izpbx-promote
  cancel-in-progress: false

env:
  PUBLIC_REPO_URL: https://github.com/ugoviti/izpbx.git
  DOCKERHUB_IMAGE: izdock/izpbx-asterisk
  # the only versions that may move "latest" (V3): the 20.16 line until the decision Q1
  LATEST_VERSIONS: '^20\.16\.[0-9]+$'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check latest
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -eu
          if [ "$LATEST" == true ] && ! [[ "$VERSION" =~ $LATEST_VERSIONS ]]; then
            echo "::error::'latest' stays on the 20.16 line until the decision Q1: run again with latest unchecked for ${VERSION}"
            exit 1
          fi

      - name: gitleaks
        uses: ./.gitea/actions/gitleaks
        with:
          config: ${{ secrets.GITLEAKS_CONFIG }}

      - name: registry login
        id: login
        uses: ./.gitea/actions/registry-login
        with:
          registry-host: ${{ secrets.REGISTRY_HOST }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: check source image
        env:
          SRC: ${{ steps.login.outputs.image }}:${{ inputs.version }}
        run: docker buildx imagetools inspect "$SRC" >/dev/null

      - name: push to github
        if: inputs.github == true || inputs.github == 'true'
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -eu
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "${VERSION} is not a git tag: nothing to push to GitHub"
            exit 0
          fi
          AUTH=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          # tag + branch fast-forwarded to the tagged commit (GitHub rejects non fast-forward)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push "$PUBLIC_REPO_URL" "${VERSION}^{commit}:refs/heads/${BRANCH}" "refs/tags/${VERSION}"

      - name: image tags
        if: inputs.dockerhub == true || inputs.dockerhub == 'true'
        id: tags
        uses: ./.gitea/actions/image-tags
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          version: ${{ inputs.version }}
          latest: ${{ inputs.latest }}

      - name: copy image to docker hub
        if: inputs.dockerhub == true || inputs.dockerhub == 'true'
        env:
          SRC: ${{ steps.login.outputs.image }}:${{ inputs.version }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -eu
          ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then ARGS+=(-t "$TAG"); echo "-> $TAG"; fi
          done <<< "$TAGS"
          docker buildx imagetools create "${ARGS[@]}" "$SRC"

      - name: matrix notify
        if: always()
        uses: ./.gitea/actions/matrix-notify
        with:
          status: ${{ job.status }}
          label: publish ${{ inputs.version }} (github:${{ inputs.github }} dockerhub:${{ inputs.dockerhub }})
          password: ${{ secrets.MATRIX_PASSWORD }}
          homeserver: ${{ vars.MATRIX_HOMESERVER }}
          room-id: ${{ vars.MATRIX_ROOM_ID }}
          user: ${{ vars.MATRIX_USER }}
