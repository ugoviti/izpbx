# izPBX publish (Gitea Actions)
# Manual only: Repository > Actions > izpbx-promote > Run workflow.
# The ONLY way code and images leave the private infrastructure:
#   1. gitleaks scan of the full history with the private rules (blocks everything on findings)
#   2. pushes the git tag, and the branch up to that tag, to GitHub (fast-forward only)
#   3. copies the image already built in the Gitea registry to Docker Hub, without rebuilding
#      (same digest you tested). Tag scheme: .gitea/actions/image-tags
#        20.16.22    -> 20.16.22, 20.16, 20 [, latest]
#        dev-22.17   -> dev-22.17 (not a git tag: GitHub push is skipped, never latest)
#   4. with branch main (the project page): the README.md of the tag becomes the Docker Hub
#      overview, its relative links made absolute on GitHub at the tag
#      (izpbx-asterisk/tools/readme-dockerhub.sh; skipped with a warning when over 25000 bytes)
# Branch only (version empty): no release, no image. The branch of Gitea is pushed as it is to
# GitHub (fast-forward only, after gitleaks); with branch main the Docker Hub overview follows
# its README (links at main).
#
# Required secrets:   REGISTRY_HOST, REGISTRY_USERNAME, REGISTRY_TOKEN, DOCKER_USERNAME,
#                     DOCKER_PASSWORD, GH_PUSH_TOKEN, GITLEAKS_CONFIG, MATRIX_PASSWORD
# Required variables: MATRIX_HOMESERVER, MATRIX_ROOM_ID, MATRIX_USER

name: izpbx-promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must exist in the Gitea registry, eg. 20.16.22); empty = push only the branch to GitHub
        required: false
        default: ''
      latest:
        description: Also move the "latest" Docker tag (only 20.16.x until the decision Q1, refused otherwise)
        type: boolean
        default: true
      github:
        description: Also push the git tag and branch to GitHub
        type: boolean
        default: true
      branch:
        description: GitHub branch to fast-forward to the tagged commit
        default: main
      dockerhub:
        description: Also publish the image on Docker Hub
        type: boolean
        default: true
      overview:
        description: Also update the Docker Hub overview from README.md (only with github, dockerhub and branch main)
        type: boolean
        default: true

concurrency:
  group: izpbx-promote
  cancel-in-progress: false

env:
  PUBLIC_REPO_URL: https://github.com/ugoviti/izpbx.git
  DOCKERHUB_IMAGE: izdock/izpbx-asterisk
  # the only versions that may move "latest" (V3): the 20.16 line until the decision Q1
  LATEST_VERSIONS: '^20\.16\.[0-9]+$'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check latest
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -eu
          if [ -n "$VERSION" ] && [ "$LATEST" == true ] && ! [[ "$VERSION" =~ $LATEST_VERSIONS ]]; then
            echo "::error::'latest' stays on the 20.16 line until the decision Q1: run again with latest unchecked for ${VERSION}"
            exit 1
          fi

      - name: gitleaks
        uses: ./.gitea/actions/gitleaks
        with:
          config: ${{ secrets.GITLEAKS_CONFIG }}

      - name: registry login
        if: inputs.version != ''
        id: login
        uses: ./.gitea/actions/registry-login
        with:
          registry-host: ${{ secrets.REGISTRY_HOST }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: check source image
        if: inputs.version != ''
        env:
          SRC: ${{ steps.login.outputs.image }}:${{ inputs.version }}
        run: docker buildx imagetools inspect "$SRC" >/dev/null

      - name: push to github
        if: inputs.github == true || inputs.github == 'true'
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -eu
          AUTH=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          if [ -z "$VERSION" ]; then
            # branch only: the branch of Gitea as it is (fast-forward only on GitHub)
            git rev-parse -q --verify "refs/remotes/origin/${BRANCH}" >/dev/null || { echo "::error::no branch ${BRANCH} on Gitea"; exit 1; }
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
              push "$PUBLIC_REPO_URL" "refs/remotes/origin/${BRANCH}:refs/heads/${BRANCH}"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "${VERSION} is not a git tag: nothing to push to GitHub"
            exit 0
          fi
          # tag + branch fast-forwarded to the tagged commit (GitHub rejects non fast-forward)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push "$PUBLIC_REPO_URL" "${VERSION}^{commit}:refs/heads/${BRANCH}" "refs/tags/${VERSION}"

      - name: image tags
        if: inputs.version != '' && (inputs.dockerhub == true || inputs.dockerhub == 'true')
        id: tags
        uses: ./.gitea/actions/image-tags
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          version: ${{ inputs.version }}
          latest: ${{ inputs.latest }}

      - name: copy image to docker hub
        if: inputs.version != '' && (inputs.dockerhub == true || inputs.dockerhub == 'true')
        env:
          SRC: ${{ steps.login.outputs.image }}:${{ inputs.version }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -eu
          ARGS=()
          while read -r TAG; do
            if [ -n "$TAG" ]; then ARGS+=(-t "$TAG"); echo "-> $TAG"; fi
          done <<< "$TAGS"
          docker buildx imagetools create "${ARGS[@]}" "$SRC"

      - name: docker hub overview
        if: (inputs.overview == true || inputs.overview == 'true') && (inputs.dockerhub == true || inputs.dockerhub == 'true') && (inputs.github == true || inputs.github == 'true') && inputs.branch == 'main'
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          # the README of the tag (links at the tag), or of the branch without a version
          if [ -n "$VERSION" ]; then src="refs/tags/${VERSION}" ref=$VERSION; else src="refs/remotes/origin/${BRANCH}" ref=$BRANCH; fi
          if ! git rev-parse -q --verify "$src" >/dev/null; then
            echo "${ref} is not a git tag or branch: Docker Hub overview not changed"
            exit 0
          fi
          # links absolute on GitHub at the tag or branch (the tool of this branch)
          if ! git show "${src}:README.md" | izpbx-asterisk/tools/readme-dockerhub.sh "$ref" - > overview.md; then
            echo "::warning::README.md of ${ref} does not fit the Docker Hub overview: not changed"
            exit 0
          fi
          creds=$(jq -n --arg u "$DOCKER_USERNAME" --arg p "$DOCKER_PASSWORD" '{identifier: $u, secret: $p}')
          TOKEN=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$creds" \
            https://hub.docker.com/v2/auth/token | jq -r '.access_token // empty') || TOKEN=''
          if [ -z "$TOKEN" ]; then
            creds=$(jq -n --arg u "$DOCKER_USERNAME" --arg p "$DOCKER_PASSWORD" '{username: $u, password: $p}')
            TOKEN=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$creds" \
              https://hub.docker.com/v2/users/login | jq -r '.token // empty')
          fi
          [ -n "$TOKEN" ] || { echo "::error::Docker Hub login failed"; exit 1; }
          echo "::add-mask::$TOKEN"
          jq -Rs '{full_description: .}' overview.md > overview.json
          curl -fsS -o /dev/null -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data-binary @overview.json "https://hub.docker.com/v2/repositories/${DOCKERHUB_IMAGE}/"
          echo "Docker Hub overview of ${DOCKERHUB_IMAGE} = README.md of ${ref} ($(wc -c < overview.md) bytes)"

      - name: matrix notify
        if: always()
        uses: ./.gitea/actions/matrix-notify
        with:
          status: ${{ job.status }}
          label: publish ${{ inputs.version }} (github:${{ inputs.github }} dockerhub:${{ inputs.dockerhub }})
          password: ${{ secrets.MATRIX_PASSWORD }}
          homeserver: ${{ vars.MATRIX_HOMESERVER }}
          room-id: ${{ vars.MATRIX_ROOM_ID }}
          user: ${{ vars.MATRIX_USER }}
