# izPBX component updates (Gitea Actions)
# Every Monday at 06:00 UTC (after the weekly rebuild) and by hand.
# Job "check": izpbx-asterisk/tools/make-updates.sh read only, and sends to the Matrix room:
#   - the components of versions.env (and the FreePBX modules) with an update,
#     with the proposed lines (released by the job "release");
#   - the new major releases of Asterisk (LTS) and FreePBX: a new izPBX series,
#     never proposed (repeated every week until versions.env moves to it);
#   - the CI actions pinned in .gitea with a newer release of the same major
#     (ACTION lines; a change of the CI, never released by the job "release":
#     make-updates.sh --apply-actions and commit by hand); a newer major of an
#     action is only noted in the message, it does not send one by itself;
#   - an incomplete check (lookups unavailable) or an error.
# All current: no message, except for a run by hand.
# Job "release", when "check" found updates: the unattended release of
# izpbx-asterisk/tools/make-auto-release.sh, step by step: apply (make-updates.sh
# --apply), build of the image (ci-updates, Gitea registry), tests
# (izpbx-asterisk/tests/run.sh all-done in Docker-in-Docker), then the commit
# "updates: ...", CHANGELOG.md, the commit "X.Y.Z release" and the tag X.Y.Z
# pushed: the tag starts izpbx-release (Gitea registry). A failed step releases
# nothing. Docker Hub is never reached: izpbx-promote stays by hand, after
# testing the release. Result (released version or failed step) sent to Matrix.
#
# Optional secret:  GH_READ_TOKEN (any GitHub token: raises the GitHub API rate
#                   limit, 60 requests/hour without it)
# Required secrets: MATRIX_TOKEN; variables: MATRIX_HOMESERVER, MATRIX_ROOM_ID
# Job "release":    REGISTRY_HOST, REGISTRY_USERNAME, REGISTRY_TOKEN, and
#                   RELEASE_PUSH_TOKEN (a Gitea token with write access to the
#                   repository: a push with the automatic token does not start
#                   izpbx-release); optional variables RELEASE_GIT_NAME,
#                   RELEASE_GIT_EMAIL (author of the commits and the tag)

name: izpbx-updates
run-name: component updates check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: izpbx-updates
  cancel-in-progress: false

jobs:
  check:
    name: check the component updates (make-updates.sh)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: make-updates
        id: check
        shell: bash
        env:
          # explicit: never the token of the forge sent to api.github.com
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          EVENT: ${{ gitea.event_name }}
        run: |
          set -u
          rc=0
          izpbx-asterisk/tools/make-updates.sh > report.txt 2> report.err || rc=$?
          cat report.txt
          if [ -s report.err ]; then echo "--- stderr"; cat report.err; fi
          majors=$(grep -E '^MAJOR ' report.txt || true)
          # actions with an update in their major (the lines with "->")
          actions=$(grep -E '^ACTION .* -> ' report.txt || true)
          case "$rc" in
            0) status=current ;;
            10) status=updates ;;
            2) status=incomplete ;;
            *) status=error ;;
          esac
          # the message: the rows to update, the proposed lines, the new majors
          {
            grep -E ' UPDATE| unavailable|ERROR' report.txt || true
            sed -n '/update(s) available, proposed versions.env lines:/,/^$/p' report.txt
            sed -n '/^FreePBX modules (/,/^$/p' report.txt
            if [ -n "$majors" ]; then
              echo "new major releases (a new izPBX series, not proposed):"
              sed 's/^MAJOR /  /' <<< "$majors"
            fi
            if [ -n "$actions" ]; then
              echo "CI actions to update (make-updates.sh --apply-actions, then commit; not released):"
              grep -E '^ACTION ' report.txt | grep -v ': unavailable' | sed 's/^ACTION /  /'
            fi
            if [ "$rc" -eq 10 ]; then echo "release: the job release applies them, runs the tests and releases (make-auto-release.sh)"; fi
            if [ "$status" == current ] && [ -z "$majors" ] && [ -z "$actions" ]; then echo "all components are current"; fi
          } > message.txt
          nmajors=0
          if [ -n "$majors" ]; then nmajors=$(grep -c . <<< "$majors"); fi
          nactions=0
          if [ -n "$actions" ]; then nactions=$(grep -c . <<< "$actions"); fi
          notify=false
          if [ "$status" != current ] || [ -n "$majors" ] || [ -n "$actions" ] || [ "$EVENT" == workflow_dispatch ]; then notify=true; fi
          {
            echo "status=${status}"
            echo "notify=${notify}"
            echo "majors=${nmajors}"
            echo "actions=${nactions}"
            echo "message<<IZPBX_EOF"
            head -c 3500 message.txt
            echo
            echo "IZPBX_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "result: ${status}, ${nmajors} new major(s), ${nactions} action update(s), notify ${notify}"
          # updates and new majors are news, not a failure; an error fails the job
          [ "$status" != error ]

      - name: matrix notify
        if: always() && (steps.check.outputs.notify == 'true' || failure())
        uses: ./.gitea/actions/matrix-notify
        with:
          # success = all current; anything else is shown with the warning icon
          status: ${{ failure() && 'failure' || (steps.check.outputs.status == 'current' && steps.check.outputs.majors == '0' && steps.check.outputs.actions == '0') && 'success' || steps.check.outputs.status }}
          label: component updates
          details: ${{ steps.check.outputs.message }}
          token: ${{ secrets.MATRIX_TOKEN }}
          homeserver: ${{ vars.MATRIX_HOMESERVER }}
          room-id: ${{ vars.MATRIX_ROOM_ID }}

  release:
    name: apply, test and tag a release (needs RELEASE_PUSH_TOKEN)
    needs: check
    if: needs.check.outputs.status == 'updates'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the tags (previous release, CHANGELOG lines) and a token whose push starts izpbx-release
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: apply
        id: apply
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -u
          [ -n "$PUSH_TOKEN" ] || { echo "::error::secret RELEASE_PUSH_TOKEN missing: nothing released"; exit 1; }
          rc=0
          izpbx-asterisk/tools/make-auto-release.sh apply || rc=$?
          # 3: all current again (upstream moved since the check)
          if [ "$rc" -eq 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: build and push
        if: steps.apply.outputs.changed == 'true'
        uses: ./.gitea/actions/build-push
        with:
          version: ci-updates
          cache-tag: buildcache-ci
          registry-host: ${{ secrets.REGISTRY_HOST }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

      - name: registry login
        if: steps.apply.outputs.changed == 'true'
        id: login
        uses: ./.gitea/actions/registry-login
        with:
          registry-host: ${{ secrets.REGISTRY_HOST }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

      - name: tests
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.login.outputs.image }}:ci-updates
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          izpbx-asterisk/tests/ci/dind-run.sh "$IMAGE" -j 4 all-done

      - name: release
        if: steps.apply.outputs.changed == 'true'
        id: release
        shell: bash
        env:
          GIT_NAME: ${{ vars.RELEASE_GIT_NAME }}
          GIT_EMAIL: ${{ vars.RELEASE_GIT_EMAIL }}
        run: |
          set -euo pipefail
          git config user.name "${GIT_NAME:-izPBX updates}"
          git config user.email "${GIT_EMAIL:-izpbx-updates@localhost}"
          izpbx-asterisk/tools/make-auto-release.sh release --push
          v=$(git describe --tags --exact-match HEAD)
          {
            echo "version=$v"
            echo "message<<IZPBX_EOF"
            echo "izPBX $v released (Gitea registry): $(git log -1 --format=%s HEAD~1)"
            echo "test it, then publish it with izpbx-promote (by hand)"
            echo "IZPBX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: matrix notify
        if: always() && (steps.apply.outputs.changed == 'true' || failure())
        uses: ./.gitea/actions/matrix-notify
        with:
          status: ${{ job.status }}
          label: ${{ steps.release.outputs.version && format('auto release {0}', steps.release.outputs.version) || 'auto release' }}
          details: ${{ steps.release.outputs.message || 'not released, see the failed step of the job release' }}
          token: ${{ secrets.MATRIX_TOKEN }}
          homeserver: ${{ vars.MATRIX_HOMESERVER }}
          room-id: ${{ vars.MATRIX_ROOM_ID }}
