# izPBX weekly rebuild (Gitea Actions)
# Rebuilds the latest stable release tag (X.Y.Z) of each maintained branch every week to pick up the
# OS security updates (eg. PHP), even when no new izPBX release is tagged (V4). Matrix:
#   - release/20.16: the 20.16.x tags (Rocky Linux), security only until 2027-01-01;
#   - main:          the tags from 22 on (22.17.x and later, Debian); nothing to do until the first
#                    one (the older lines 18.x, 16.x are end of life, never rebuilt).
# OS_UPDATE_STAMP=<ISO week> busts the cached OS upgrade layer of izpbx-asterisk/Dockerfile.
#
# Pushes ONLY to the Gitea registry and NEVER moves the release tags (X.Y.Z, X.Y, X, latest), so
# izpbx-promote keeps copying exactly the release digest that was tested. Tags produced (see .gitea/actions/image-tags):
#   <X.Y.Z>-<YYYY>-W<WW>  and  <X.Y.Z>-<YYYY>-W<WW>-<run_number>      (eg. 20.16.22-2026-W43, 20.16.22-2026-W43-57)
# To publish a weekly image on Docker Hub run izpbx-promote manually with that version (never automatic).
#
# The CI tooling (.gitea/actions) comes from the branch of the matrix entry (release/20.16 keeps the
# Rocky checks), the build context (izpbx-asterisk/) from the tag.
#
# Required secrets:   REGISTRY_HOST, REGISTRY_USERNAME, REGISTRY_TOKEN, MATRIX_TOKEN
# Required variables: MATRIX_HOMESERVER, MATRIX_ROOM_ID

name: izpbx-weekly-rebuild

on:
  schedule:
    # every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: izpbx-weekly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # tags: the X.Y.Z tags of the branch (extended regex); skip_tags: tags of the other branch (not "exclude": a reserved key of the matrix)
          - branch: release/20.16
            line: '20.16'
            tags: '^20\.16\.[0-9]+$'
            skip_tags: '^$'
          - branch: main
            line: main
            # the lines from 22 on: not 20.16 (release/20.16) nor the older ones (18.x, 16.x, EOL)
            tags: '^(2[2-9]|[3-9][0-9])\.[0-9]+\.[0-9]+$'
            skip_tags: '^$'
    name: rebuild ${{ matrix.branch }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: resolve latest release
        id: ver
        env:
          TAGS: ${{ matrix.tags }}
          SKIP_TAGS: ${{ matrix.skip_tags }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          # latest stable X.Y.Z tag of the branch (version sort, prereleases and dev tags excluded)
          TAG=$(git tag --list | grep -E "$TAGS" | grep -vE "$SKIP_TAGS" | sort -V | tail -1 || true)
          if [ -z "$TAG" ]; then
            echo "::notice::${BRANCH}: no X.Y.Z release tag yet, nothing to rebuild"
            exit 0
          fi
          # build context from the tag, CI tooling from the branch
          rm -rf izpbx-asterisk
          git checkout "refs/tags/${TAG}" -- izpbx-asterisk
          STAMP=$(date -u +%G-W%V)
          {
            echo "tag=${TAG}"
            echo "stamp=${STAMP}"
            echo "version=${TAG}-${STAMP}"
            echo "commit=$(git rev-parse --short=7 "refs/tags/${TAG}^{commit}")"
          } >> "$GITHUB_OUTPUT"
          echo "${BRANCH}: rebuilding ${TAG} with OS_UPDATE_STAMP=${STAMP} -> ${TAG}-${STAMP}"

      - name: build and push
        if: steps.ver.outputs.tag != ''
        uses: ./.gitea/actions/build-push
        with:
          version: ${{ steps.ver.outputs.version }}
          latest: 'false'
          build-number: ${{ gitea.run_number }}
          cache-tag: buildcache-weekly-${{ matrix.line }}
          build-args: |
            OS_UPDATE_STAMP=${{ steps.ver.outputs.stamp }}
            APP_BUILD_COMMIT=${{ steps.ver.outputs.commit }}
          registry-host: ${{ secrets.REGISTRY_HOST }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

      - name: matrix notify
        if: always()
        uses: ./.gitea/actions/matrix-notify
        with:
          status: ${{ job.status }}
          label: weekly rebuild ${{ matrix.branch }} tag:${{ steps.ver.outputs.tag || 'none' }} -> ${{ steps.ver.outputs.version || 'nothing to rebuild' }}
          token: ${{ secrets.MATRIX_TOKEN }}
          homeserver: ${{ vars.MATRIX_HOMESERVER }}
          room-id: ${{ vars.MATRIX_ROOM_ID }}
