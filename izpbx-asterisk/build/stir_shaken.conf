; STIR/SHAKEN (res_stir_shaken, res_pjsip_stir_shaken): izPBX default in place
; of the Asterisk sample. Both services are off: with no object at all
; Asterisk logs two WARNINGs at every start and reload.
;
; To sign outgoing calls or verify incoming ones (US/Canada carriers), set
; global_disable=no, add the certificates and a "profile", and set
; stir_shaken_profile on the trunk in pjsip.endpoint_custom_post.conf.
; Guide: https://github.com/ugoviti/izpbx/blob/main/docs/operations.md#stirshaken
; All the options: https://docs.asterisk.org/Asterisk_22_Documentation/API_Documentation/Module_Configuration/res_stir_shaken/

[attestation]
global_disable=yes

[verification]
global_disable=yes
