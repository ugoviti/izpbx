; izPBX php-fpm pool (design H1): FreePBX runs as asterisk, Apache (also
; asterisk, envvars) talks to it through the Debian socket of
; conf-available/php8.2-fpm.conf. Debian's www pool is removed at build.
[asterisk]
user = asterisk
group = asterisk
listen = /run/php/php8.2-fpm.sock
listen.owner = asterisk
listen.group = asterisk
listen.mode = 0660

; sized for one PBX web interface (UCP, admin, phonebook)
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; FreePBX reads the environment (TZ, AMP*): keep it
clear_env = no
; warnings and errors of the workers go to the container log (design H2)
catch_workers_output = yes
decorate_workers_output = no
