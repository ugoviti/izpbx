; P5-03: fax with spandsp between two channels of the same Asterisk.
; G.711: "channel originate Local/s@fax-rx-g711 extension s@fax-tx-g711"
; T.38:  "channel originate PJSIP/rx@loop extension s@fax-tx-t38": the call
;        goes out to 127.0.0.1 (pjsip.conf, endpoint loop, t38_udptl) and
;        comes back in fax-rx-t38; SendFax runs on the PJSIP channel itself
;        (through a Local channel the T.38 re-INVITE gets 488).
; FAXSTATUS and FAXPAGES of each side end up in the astdb (faxtest/<side>)
; from the hangup handlers.
[fax-tx-g711]
exten => s,1,SendFax(/fax/test-2pages.tif)
exten => h,1,Set(DB(faxtest/tx-g711)=${FAXSTATUS}:${FAXPAGES})

[fax-rx-g711]
exten => s,1,ReceiveFax(/tmp/rx-g711.tif)
exten => h,1,Set(DB(faxtest/rx-g711)=${FAXSTATUS}:${FAXPAGES})

[fax-tx-t38]
exten => s,1,SendFax(/fax/test-2pages.tif)
exten => h,1,Set(DB(faxtest/tx-t38)=${FAXSTATUS}:${FAXPAGES})

[fax-rx-t38]
exten => rx,1,Answer()
 same => n,ReceiveFax(/tmp/rx-t38.tif)
exten => h,1,Set(DB(faxtest/rx-t38)=${FAXSTATUS}:${FAXPAGES})

; negative check: a file that does not exist cannot be sent
[fax-tx-bad]
exten => s,1,SendFax(/fax/no-such-file.tif)
exten => h,1,Set(DB(faxtest/tx-bad)=${FAXSTATUS}:${FAXPAGES})

[fax-rx-bad]
exten => s,1,ReceiveFax(/tmp/rx-bad.tif)
exten => h,1,Set(DB(faxtest/rx-bad)=${FAXSTATUS}:${FAXPAGES})
