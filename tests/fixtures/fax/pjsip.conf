; P5-03: Asterisk calls itself over PJSIP with T.38 (UDPTL)
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[loop]
type = endpoint
transport = transport-udp
context = fax-rx-t38
disallow = all
allow = alaw,ulaw
direct_media = no
t38_udptl = yes
t38_udptl_ec = redundancy
t38_udptl_maxdatagram = 400
aors = loop

[loop]
type = aor
contact = sip:127.0.0.1:5060

[loop]
type = identify
endpoint = loop
match = 127.0.0.1
