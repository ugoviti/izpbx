<?php
// P3-15: stand-in for the FreePBX bootstrap (/etc/freepbx.conf) until FreePBX
// is in the image: the phonebook only needs the global $db (a PDO object) and
// DB::IsError(). SQLite in memory with the tables and columns the phonebook
// reads; SQL errors raise exceptions, so an injection that breaks the query
// shows up as an error page instead of an empty phonebook.
class DB { public static function IsError($r) { return false; } }
$db = new PDO('sqlite::memory:');
$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
$db->exec("ATTACH DATABASE ':memory:' AS asterisk");
$db->exec("CREATE TABLE devices (id TEXT, description TEXT, tech TEXT)");
$db->exec("INSERT INTO devices VALUES ('1001', 'Alice', 'pjsip'), ('1002', 'Bob', 'pjsip')");
foreach (['main', 'asterisk'] as $s) {
  $db->exec("CREATE TABLE $s.contactmanager_groups (id INTEGER, name TEXT, owner INTEGER, type TEXT)");
  $db->exec("INSERT INTO $s.contactmanager_groups VALUES (1, 'User Manager Group', -1, 'internal'), (2, 'contacts', -1, 'external')");
}
$db->exec("CREATE TABLE contactmanager_group_entries (id INTEGER, groupid INTEGER, displayname TEXT)");
$db->exec("INSERT INTO contactmanager_group_entries VALUES (10, 2, 'Carol Contact')");
$db->exec("CREATE TABLE contactmanager_entry_numbers (id INTEGER, entryid INTEGER, number TEXT, type TEXT, E164 TEXT)");
$db->exec("INSERT INTO contactmanager_entry_numbers VALUES (100, 10, '+390551234567', 'work', '+390551234567')");
