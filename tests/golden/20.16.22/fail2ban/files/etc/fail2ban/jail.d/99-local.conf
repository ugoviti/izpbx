[DEFAULT]
# whitelist the following IP
ignoreip=127.0.0.0/8 10.0.0.0/8
bantime=600
findtime=1200
maxretry=5
banaction=iptables-allports[blocktype=DROP]

destemail=security@example.com
sender=fail2ban@example.com

## ban sending mail report
#action = %(action_mwl)s

## ban whitout sending mail report
action = %(action_)s

# logs override
logtarget = /var/log/fail2ban/fail2ban.log
apache_error_log = /var/log/httpd/*error*log
apache_access_log = /var/log/httpd/*access*log

## comment out to enable all jails
#enabled = true

# find and ban recurring attackers
[recidive]
enabled=false
logpath  = /var/log/fail2ban/fail2ban.log
action   = %(action_mwl)s
protocol = all
bantime=86400
findtime=604800
maxretry=3

[asterisk]
enabled=true
logpath=/var/log/asterisk/security

[freepbx]
enabled = true
logpath = /var/log/asterisk/freepbx_security.log

[apache-auth]
enabled = true

[apache-badbots]
enabled = true

[apache-noscript]
enabled = true

[apache-overflows]
enabled = true

[apache-nohome]
enabled = true

[apache-botsearch]
enabled = true

[apache-fakegooglebot]
enabled = true

[apache-shellshock]
enabled = true
