
# global settings (server config context, inherited by all virtualhosts)
# reject request bodies bigger than PHP post_max_size (128M) before reaching PHP
LimitRequestBody 134217728

# default virtualhost

<VirtualHost *:8080>
  DocumentRoot /var/www/html
  <IfModule mod_rewrite.c>
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !\.well-known/acme-challenge
    RewriteCond %{REQUEST_URI} !\.freepbx-known
    RewriteCond %{HTTPS} off
    #RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
    RewriteRule .? https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
  </IfModule>

  <Directory /var/www/html>
    Options Includes FollowSymLinks
    AllowOverride All
    Require ip 10.0.0.0/8
    Require ip 192.168.0.0/16
  </Directory>
</VirtualHost>

# pbx.example.com virtualhost
  <VirtualHost *:8080>
    ServerName pbx.example.com
# enable http to https automatic rewrite
<IfModule mod_rewrite.c>
  RewriteEngine on
  RewriteCond %{REQUEST_URI} !\.well-known/acme-challenge
  RewriteCond %{REQUEST_URI} !\.freepbx-known
  RewriteCond %{HTTPS} off
  #RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
  RewriteRule .? https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</IfModule>

<Directory /var/www/html>
    Options Includes FollowSymLinks
    AllowOverride All
    Require ip 10.0.0.0/8
    Require ip 192.168.0.0/16
  </Directory>
</VirtualHost>


# enable HTTPS listening
Listen 8443 https
SSLPassPhraseDialog    exec:/usr/libexec/httpd-ssl-pass-dialog
SSLSessionCache        shmcb:/run/httpd/sslcache(512000)
SSLSessionCacheTimeout 300
SSLCryptoDevice        builtin

# enable default ssl virtualhost with self signed certificate
<VirtualHost _default_:8443>
  ErrorLog                 logs/ssl_error_log
  TransferLog              logs/ssl_access_log
  LogLevel                 warn
  
  SSLEngine                on
  SSLHonorCipherOrder      on
  SSLCipherSuite           PROFILE=SYSTEM
  SSLProxyCipherSuite      PROFILE=SYSTEM
  SSLCertificateFile       /etc/asterisk/keys/default.crt
  SSLCertificateKeyFile    /etc/asterisk/keys/default.key
  

  <Directory /var/www/html>
    Options Includes FollowSymLinks
    AllowOverride All
    Require ip 10.0.0.0/8
    Require ip 192.168.0.0/16
  </Directory>
</VirtualHost>

