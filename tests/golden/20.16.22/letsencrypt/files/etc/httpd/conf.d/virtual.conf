
# global settings (server config context, inherited by all virtualhosts)
# reject request bodies bigger than PHP post_max_size (128M) before reaching PHP
LimitRequestBody 134217728

# default virtualhost

<VirtualHost *:80>
  DocumentRoot /var/www/html

  <Directory /var/www/html>
    Options Includes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>

# pbx.example.com virtualhost
  <VirtualHost *:80>
    ServerName pbx.example.com
<Directory /var/www/html>
    Options Includes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>


# enable HTTPS listening
Listen 443 https
SSLPassPhraseDialog    exec:/usr/libexec/httpd-ssl-pass-dialog
SSLSessionCache        shmcb:/run/httpd/sslcache(512000)
SSLSessionCacheTimeout 300
SSLCryptoDevice        builtin

# enable ssl virtualhost using Let's Encrypt certificates
<VirtualHost *:443>
  ServerName pbx.example.com

  ErrorLog                 logs/ssl_error_log
  TransferLog              logs/ssl_access_log
  LogLevel                 warn
  
  SSLEngine               on
  SSLHonorCipherOrder     on
  SSLCipherSuite          PROFILE=SYSTEM
  SSLProxyCipherSuite     PROFILE=SYSTEM
  SSLCertificateFile      /etc/asterisk/keys/integration/webserver.crt
  SSLCertificateKeyFile   /etc/asterisk/keys/integration/webserver.key
  SSLCertificateChainFile /etc/asterisk/keys/integration/certificate.pem
  
  <Directory /var/www/html>
    Options Includes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>

